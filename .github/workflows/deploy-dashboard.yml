name: Deploy dashboard

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  deploy:
    name: Deploy ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}
      url: ${{ startsWith(github.ref, 'refs/tags/') && 'https://dash.catto.one' || 'https://dev.catto.one' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify production tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use the stable SemVer form vMAJOR.MINOR.PATCH."
            exit 1
          fi

          git fetch origin main
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Production tags must point to a commit contained in main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test dashboard
        run: pnpm --filter catto-dashboard test

      - name: Build and deploy dashboard
        run: pnpm --filter catto-dashboard deploy:cloudflare
