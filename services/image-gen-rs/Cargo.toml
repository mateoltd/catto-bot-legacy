[package]
name = "image-gen-service"
version = "0.1.0"
edition = "2021"
description = "High-performance image generation microservice for bonk memes, rank cards, and leaderboards"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

# 2D rendering
tiny-skia = "0.11"
# Text layout
cosmic-text = "0.12"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# HTTP client (for avatar fetching)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async utilities
futures = "0.3"

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
